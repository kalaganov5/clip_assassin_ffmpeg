name: Build and Release

on:
    push:
        branches: ["main", "master"]
        tags: ["v*"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch:

jobs:
    build:
        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pyinstaller

            - name: Build (Windows)
              if: runner.os == 'Windows'
              run: |
                  pyinstaller --onefile --console --name "ClipAssassin_Reels" scripts/make_reels.py
                  pyinstaller --onefile --console --name "ClipAssassin_Intro" scripts/make_intro.py

            - name: Build (macOS)
              if: runner.os == 'macOS'
              run: |
                  pyinstaller --windowed --name "ClipAssassin_Reels" scripts/make_reels.py
                  pyinstaller --windowed --name "ClipAssassin_Intro" scripts/make_intro.py
                  cd dist
                  zip -r ClipAssassin_Reels_macOS.zip ClipAssassin_Reels.app
                  zip -r ClipAssassin_Intro_macOS.zip ClipAssassin_Intro.app

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ClipAssassin-${{ matrix.os }}
                  path: |
                      dist/*.exe
                      dist/*.zip

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - name: Download Windows Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: ClipAssassin-windows-latest
                  path: dist/windows

            - name: Download macOS Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: ClipAssassin-macos-latest
                  path: dist/macos

            - name: Create Release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      dist/windows/*
                      dist/macos/*
                  generate_release_notes: true
